<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Griffwerk">
<meta name="theme-color" content="#EDEAE1">
<title>Griffwerk – Gitarrencoach</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap');

  :root {
    --paper: #EDEAE1;
    --ink: #23241F;
    --ink-soft: #5B5C54;
    --line: #D7D3C6;
    --accent: #3B6E8F;
    --good: #5B7B3F;
    --warn: #B8862E;
    --hard: #A83A2E;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 32px 16px 60px;
    -webkit-tap-highlight-color: transparent;
  }

  .sheet { max-width: 1080px; margin: 0 auto; }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 12px;
    margin-bottom: 20px;
  }

  .masthead h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 30px;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .masthead .sub {
    font-size: 12px;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .layout {
    display: flex;
    gap: 24px;
    align-items: flex-start;
  }

  .sidebar {
    width: 300px;
    flex-shrink: 0;
  }

  .main-col { flex: 1; min-width: 0; }

  .new-song-btn {
    width: 100%;
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 15px;
    padding: 14px;
    border: 2px solid var(--ink);
    background: var(--ink);
    color: #fff;
    border-radius: 4px;
    cursor: pointer;
    margin-bottom: 16px;
  }
  .new-song-btn:active { transform: scale(0.98); }

  .song-card {
    background: #fff;
    border: 1px solid var(--line);
    border-left: 4px solid var(--line);
    border-radius: 4px;
    padding: 14px 16px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: border-color 0.1s ease;
  }
  .song-card:hover { border-left-color: var(--accent); }
  .song-card.selected { border-left-color: var(--ink); background: #fff; box-shadow: inset 0 0 0 1px var(--ink); }

  .song-card .title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 16px; }
  .song-card .artist { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .song-card .meta-row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
  .badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 999px;
    color: #fff;
  }
  .progress-track { flex: 1; height: 4px; background: var(--line); border-radius: 999px; margin-left: 10px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--good); }

  .sidebar-group-label {
    font-family: 'Fraunces', serif; font-size: 12px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--ink-soft); margin: 18px 0 8px; padding-bottom: 4px;
    border-bottom: 1px solid var(--line);
  }
  .sidebar-group-label:first-child { margin-top: 0; }

  .queue-card {
    background: #fff; border: 1px dashed var(--line); border-radius: 4px; padding: 12px 14px; margin-bottom: 10px;
  }
  .queue-card .title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 15px; }
  .queue-card .artist { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .queue-card .reason { font-size: 12px; color: var(--accent); margin-top: 6px; font-style: italic; }
  .queue-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; gap: 8px; }
  .queue-actions .export-btn { padding: 6px 12px; font-size: 12px; }

  .diff-score .personal { font-size: 18px; color: var(--ink-soft); font-weight: 500; }

  .empty-state {
    text-align: center;
    color: var(--ink-soft);
    font-size: 14px;
    padding: 60px 20px;
    border: 1px dashed var(--line);
    border-radius: 4px;
    background: #fff;
  }

  .panel { background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 22px 24px; }

  .song-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; gap: 12px; }
  .song-head h2 { font-family: 'Fraunces', serif; font-size: 24px; margin: 0; }
  .song-head .artist { color: var(--ink-soft); font-size: 14px; margin-top: 2px; }
  .song-meta-line { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--ink-soft); margin-top: 8px; }

  .icon-btn {
    background: none; border: none; color: var(--ink-soft); cursor: pointer; font-size: 14px; padding: 4px 6px;
  }
  .icon-btn:hover { color: var(--hard); }

  .tabbar { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 18px 0 20px; flex-wrap: wrap; }
  .tab-btn {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-soft);
    background: none;
    border: none;
    padding: 10px 14px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .tab-btn.active { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }

  .section-label {
    font-family: 'Fraunces', serif;
    font-size: 14px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    border-bottom: 1px solid var(--line);
    padding-bottom: 6px;
    margin: 22px 0 10px;
  }
  .section-label:first-child { margin-top: 0; }

  /* Difficulty gauge */
  .diff-row { display: flex; align-items: center; gap: 16px; margin-bottom: 6px; }
  .diff-score { font-family: 'Fraunces', serif; font-weight: 600; font-size: 34px; min-width: 70px; }
  .diff-gauge-track { flex: 1; height: 10px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .diff-gauge-fill { height: 100%; border-radius: 999px; }
  .diff-label { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }

  .diff-breakdown { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
  .diff-bd-row { display: grid; grid-template-columns: 150px 1fr 40px; align-items: center; gap: 10px; font-size: 12.5px; }
  .diff-bd-track { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .diff-bd-fill { height: 100%; background: var(--accent); border-radius: 999px; }
  .diff-bd-val { font-family: 'JetBrains Mono', monospace; text-align: right; color: var(--ink-soft); }

  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-top: 18px; }
  .stat-box { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; }
  .stat-box .n { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 600; }
  .stat-box .l { font-size: 11px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2px; }

  /* Griffbild table: top row = strings thick(left)->thin(right), bottom row = x or fret number */
  .griff {
    display: inline-block;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 4px;
    overflow: hidden;
  }
  .griff table { border-collapse: collapse; }
  .griff th, .griff td {
    width: 34px;
    height: 30px;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    border-right: 1px solid var(--line);
  }
  .griff th:last-child, .griff td:last-child { border-right: none; }
  .griff th {
    background: var(--paper);
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-soft);
    border-bottom: 1px solid var(--line);
  }
  .griff td { font-size: 14px; font-weight: 600; }
  .griff td.muted { color: var(--ink-soft); font-weight: 400; }
  .griff td.open { color: var(--good); }
  .griff .string-bar { display: block; margin: 0 auto; background: var(--ink); border-radius: 2px; }

  .griff-card { display: inline-flex; flex-direction: column; align-items: center; gap: 6px; margin: 0 12px 16px 0; vertical-align: top; }
  .griff-card .cname { font-family: 'Fraunces', serif; font-weight: 600; font-size: 14px; }
  .griff-card .ctag { font-size: 10px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.05em; }

  .chip-strip { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
  .chip {
    background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px;
    font-family: 'JetBrains Mono', monospace; font-size: 12px; text-align: center; min-width: 54px;
  }
  .chip .cn { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 12px; margin-bottom: 2px; }
  .chip .cs { color: var(--ink-soft); }

  .notation-card { background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 12px; margin-bottom: 14px; overflow-x: auto; }
  .notation-card svg { display: block; }

  /* Plan */
  .plan-day { background: #fff; border: 1px solid var(--line); border-radius: 4px; margin-bottom: 14px; overflow: hidden; }
  .plan-day-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: var(--paper); border-bottom: 1px solid var(--line); }
  .plan-day-head .d-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 15px; }
  .plan-day-head .d-meta { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--ink-soft); }
  .plan-task { display: flex; align-items: flex-start; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .plan-task:last-child { border-bottom: none; }
  .plan-task input[type=checkbox] { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--good); flex-shrink: 0; }
  .plan-task.done .t-text { text-decoration: line-through; color: var(--ink-soft); }
  .plan-task .t-bpm { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--accent); white-space: nowrap; }

  /* Practice mode */
  .clock-card {
    background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 18px;
    border-left: 4px solid var(--ink);
  }
  .clock-status { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft); margin-bottom: 6px; }
  .clock-display { font-family: 'JetBrains Mono', monospace; font-size: 34px; font-weight: 500; }
  button.stamp {
    font-family: 'Fraunces', serif; font-weight: 600; font-size: 15px; border: 2px solid var(--ink);
    background: transparent; color: var(--ink); padding: 14px 22px; border-radius: 999px; cursor: pointer;
  }
  button.stamp.running { background: var(--ink); color: #fff; }
  button.stamp:active { transform: scale(0.95); }

  .metro-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
  .metro-row input[type=range] { flex: 1; min-width: 160px; }
  .metro-bpm { font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 600; min-width: 70px; }

  .note { font-size: 12px; color: var(--ink-soft); margin-top: 8px; line-height: 1.5; }

  .export-btn {
    font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500; padding: 10px 18px;
    border: 1px solid var(--ink); background: #fff; color: var(--ink); border-radius: 3px; cursor: pointer;
  }
  .export-btn:active { transform: scale(0.97); }
  .export-btn.primary { background: var(--ink); color: #fff; }

  .actions { display: flex; justify-content: flex-end; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }

  details.info { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 10px; }
  details.info summary { cursor: pointer; font-size: 12px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.06em; }

  /* Modal */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(35,36,31,0.55); display: flex; align-items: flex-start;
    justify-content: center; padding: 30px 14px; overflow-y: auto; z-index: 50;
  }
  .modal {
    background: var(--paper); border-radius: 6px; max-width: 720px; width: 100%; padding: 26px;
    border: 1px solid var(--line);
  }
  .modal h3 { font-family: 'Fraunces', serif; margin: 0 0 4px; font-size: 20px; }
  .modal-tabs { display: flex; gap: 6px; margin: 14px 0 16px; }
  .modal-tabs button { flex: 1; }

  .field { display: flex; flex-direction: column; font-size: 11px; color: var(--ink-soft); gap: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
  .field input, .field select, .field textarea {
    font-family: 'Inter', sans-serif; font-size: 14px; padding: 8px 10px; border: 1px solid var(--line);
    border-radius: 3px; background: #fff; color: var(--ink);
  }
  .field textarea { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; }
  .field-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin-bottom: 14px; }

  .prog-row {
    display: grid; grid-template-columns: 90px repeat(6, 46px) 60px 1fr 30px;
    gap: 6px; align-items: center; margin-bottom: 6px; font-size: 12px;
  }
  .prog-row input, .prog-row select { font-size: 12px; padding: 5px; border: 1px solid var(--line); border-radius: 3px; }
  .prog-head { font-size: 10px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.04em; }
  .prog-list { max-height: 320px; overflow-y: auto; margin: 10px 0; padding: 4px; background: #fff; border: 1px solid var(--line); border-radius: 4px; }

  .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }

  @media (max-width: 760px) {
    .layout { flex-direction: column; }
    .sidebar { width: 100%; }
    .diff-bd-row { grid-template-columns: 110px 1fr 34px; }
    .prog-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="sheet">

  <div class="masthead">
    <h1>Griffwerk</h1>
    <div class="sub">Dein Gitarren-Lerncoach</div>
  </div>

  <div class="layout">
    <div class="sidebar">
      <button class="new-song-btn" id="new-song-btn">+ Neuer Song</button>
      <button class="export-btn" id="spotify-import-btn" style="width:100%; margin-bottom:16px;">+ Von Spotify importieren</button>
      <div id="song-list"></div>
    </div>
    <div class="main-col" id="main-col"></div>
  </div>

</div>

<div id="modal-root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/vexflow/4.2.3/vexflow-min.js"></script>
<script>
/* ===================== Konstanten & Musik-Grundlagen ===================== */

// Saitenreihenfolge exakt wie gewünscht: links = dickste Saite (tiefes E), rechts = dünnste (hohes e)
const STRING_LABELS = ['E', 'A', 'D', 'G', 'B', 'e'];
const STRING_WEIGHT = [4, 3.4, 2.8, 2.2, 1.7, 1.3]; // fuer die visuelle Saitendicke im Kopf der Griffbild-Tabelle

// Standardstimmung als MIDI-Notennummern der leeren Saiten, tief -> hoch (E2 A2 D3 G3 B3 E4)
const TUNINGS = {
  standard: { label: 'Standard (E A D G B E)', midi: [40, 45, 50, 55, 59, 64] },
  dropD:    { label: 'Drop D (D A D G B E)',   midi: [38, 45, 50, 55, 59, 64] },
};

const NOTE_NAMES_SHARP = ['c','c#','d','d#','e','f','f#','g','g#','a','a#','b'];

const SONGS_KEY = 'griffwerk.songs.v1';
const PROGRESS_KEY = 'griffwerk.progress.v1';
const QUEUE_KEY = 'griffwerk.queue.v1';
const SUGGESTIONS_KEY = 'griffwerk.suggestions.v1';

/* Akkord-Bibliothek: Fretmuster tief->hoch (E A D G B e). 'x' = nicht gespielt, 0 = leer, n = Bund n. */
const CHORD_LIBRARY = {
  'C':      { shape: ['x',3,2,0,1,0] },
  'C7':     { shape: ['x',3,2,3,1,0] },
  'Cadd9':  { shape: ['x',3,2,0,3,0] },
  'G':      { shape: [3,2,0,0,0,3] },
  'G7':     { shape: [3,2,0,0,0,1] },
  'D':      { shape: ['x','x',0,2,3,2] },
  'D7':     { shape: ['x','x',0,2,1,2] },
  'Dsus4':  { shape: ['x','x',0,2,3,3] },
  'Dm':     { shape: ['x','x',0,2,3,1] },
  'E':      { shape: [0,2,2,1,0,0] },
  'E7':     { shape: [0,2,0,1,0,0] },
  'Em':     { shape: [0,2,2,0,0,0] },
  'Em7':    { shape: [0,2,0,0,0,0] },
  'A':      { shape: ['x',0,2,2,2,0] },
  'A7':     { shape: ['x',0,2,0,2,0] },
  'Am':     { shape: ['x',0,2,2,1,0] },
  'Am7':    { shape: ['x',0,2,0,1,0] },
  'Asus2':  { shape: ['x',0,2,2,0,0] },
  'Fmaj7':  { shape: ['x','x',3,2,1,0] },
  'F':      { shape: [1,3,3,2,1,1], barre: true },
  'Bm':     { shape: ['x',2,4,4,3,2], barre: true },
  'B':      { shape: ['x',2,4,4,4,2], barre: true },
  "F#m":    { shape: [2,4,4,2,2,2], barre: true },
  'E5':     { shape: [0,2,2,'x','x','x'] },
  'A5':     { shape: ['x',0,2,2,'x','x'] },
  'D5':     { shape: ['x','x',0,2,3,'x'] },
};

const TECHNIQUES = [
  { v: 'strum', l: 'Anschlag / Strumming' },
  { v: 'zupfen', l: 'Zupfmuster (Fingerpicking)' },
  { v: 'einzelton', l: 'Einzelton / Melodie' },
  { v: 'hammer-on', l: 'Hammer-On' },
  { v: 'pull-off', l: 'Pull-Off' },
  { v: 'slide', l: 'Slide' },
  { v: 'bend', l: 'Bending' },
  { v: 'palm-mute', l: 'Palm Mute' },
];

const BEAT_OPTIONS = [
  { v: 4, l: 'Ganze (4 Schläge)' },
  { v: 2, l: 'Halbe (2 Schläge)' },
  { v: 1, l: 'Viertel (1 Schlag)' },
  { v: 0.5, l: 'Achtel (1/2 Schlag)' },
  { v: 0.25, l: 'Sechzehntel (1/4 Schlag)' },
];

/* ===================== Utils ===================== */

function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }
function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }
function round1(n) { return Math.round(n * 10) / 10; }

function shapeKey(shape) { return shape.join(','); }

function isPlayed(v) { return v !== 'x' && v !== null && v !== undefined && v !== ''; }

function fretsOf(shape) { return shape.filter(isPlayed).map(Number); }

function shapeHardness(shape, explicitBarre) {
  const played = fretsOf(shape);
  const fingers = played.filter(f => f > 0).length;
  const nonZero = played.filter(f => f > 0);
  const minF = nonZero.length ? Math.min(...nonZero) : 0;
  const maxF = nonZero.length ? Math.max(...nonZero) : 0;
  const sameAsMinCount = shape.filter(v => isPlayed(v) && Number(v) === minF && minF > 0).length;
  const isBarre = explicitBarre || (minF > 0 && sameAsMinCount >= 4);
  const spread = maxF - minF;
  let h = 1 + fingers * 0.3 + (isBarre ? 1.5 : 0) + (spread >= 3 ? 1 : 0) + (maxF >= 7 ? 0.5 : 0);
  return { hardness: h, isBarre, spread, maxFret: maxF, fingers };
}

function pitchToVexKey(midi) {
  const idx = ((midi % 12) + 12) % 12;
  const octave = Math.floor(midi / 12) - 1;
  return NOTE_NAMES_SHARP[idx] + '/' + octave;
}

function soundingMidi(tuningMidi, stringIndexLowToHigh, fret, capo) {
  return tuningMidi[stringIndexLowToHigh] + (capo || 0) + Number(fret);
}

function sanitizeSongData(raw) {
  if (!raw || typeof raw !== 'object') throw new Error('Kein gültiges Song-Objekt.');
  if (typeof raw.title !== 'string' || !raw.title.trim()) throw new Error('"title" fehlt oder ist kein Text.');
  if (!Array.isArray(raw.progression) || !raw.progression.length) throw new Error('"progression" fehlt oder ist leer.');

  const allowedBeats = BEAT_OPTIONS.map(b => b.v);
  const allowedTech = new Set(TECHNIQUES.map(t => t.v));

  const progression = raw.progression.map((e, i) => {
    if (!e || typeof e !== 'object' || !Array.isArray(e.shape) || e.shape.length !== 6) {
      throw new Error(`Eintrag ${i + 1}: "shape" braucht genau 6 Werte (Saiten E A D G B e), "x" oder Bundzahl.`);
    }
    const shape = e.shape.map(v => {
      if (v === 'x' || v === null || v === undefined || v === '') return 'x';
      const n = Number(v);
      if (!Number.isFinite(n) || n < 0 || n > 24) throw new Error(`Eintrag ${i + 1}: Bundzahlen müssen zwischen 0 und 24 liegen (oder "x").`);
      return n;
    });
    const beatsNum = Number(e.beats);
    const beats = allowedBeats.includes(beatsNum) ? beatsNum : 1;
    const technique = allowedTech.has(e.technique) ? e.technique : 'strum';
    return {
      section: String(e.section || 'Song').slice(0, 60),
      chord: String(e.chord || '?').slice(0, 30),
      shape, beats, technique,
      barre: !!e.barre,
    };
  });

  const tuning = TUNINGS[raw.tuning] ? raw.tuning : 'standard';
  const bpm = clamp(Math.round(Number(raw.bpm)) || 100, 20, 300);
  const capo = clamp(Math.round(Number(raw.capo)) || 0, 0, 12);
  const timeSignature = [3, 4, 6].includes(Number(raw.timeSignature)) ? Number(raw.timeSignature) : 4;

  return {
    title: String(raw.title).slice(0, 120),
    artist: String(raw.artist || '').slice(0, 120),
    notes: String(raw.notes || '').slice(0, 500),
    spotifyUrl: String(raw.spotifyUrl || '').slice(0, 300),
    bpm, capo, timeSignature, tuning,
    progression,
  };
}

function sanitizeStub(raw) {
  if (!raw || typeof raw !== 'object' || typeof raw.title !== 'string' || !raw.title.trim()) {
    throw new Error('Jeder Eintrag braucht mindestens ein "title"-Feld.');
  }
  return {
    id: uid(),
    title: String(raw.title).slice(0, 120),
    artist: String(raw.artist || '').slice(0, 120),
    spotifyUrl: String(raw.spotifyUrl || '').slice(0, 300),
    reason: String(raw.reason || '').slice(0, 200),
  };
}

function beatsToDuration(beats) {
  const map = { 4: 'w', 2: 'h', 1: 'q', 0.5: '8', 0.25: '16' };
  return map[beats] || 'q';
}

function formatClock(sec) {
  sec = Math.floor(sec);
  const h = String(Math.floor(sec / 3600)).padStart(2, '0');
  const m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
  const s = String(sec % 60).padStart(2, '0');
  return `${h}:${m}:${s}`;
}

/* ===================== Schwierigkeitsbewertung (0-100, erklärbar) ===================== */

function computeDifficulty(song, knownSet) {
  const prog = song.progression || [];
  if (!prog.length) return { score: 0, personalScore: null, label: 'Keine Daten', color: '#999', breakdown: [] };

  const shapesSeen = new Map(); // key -> {shape, hardness info, count, beats}
  let totalBeats = 0;
  let transitions = 0;
  let prevKey = null;
  let barreOrHardBeats = 0;
  let personalBarreOrHardBeats = 0;
  let techniqueScoreRaw = 0;
  const durationsUsed = new Set();
  let nonIntegerBeats = 0;

  prog.forEach(entry => {
    const key = shapeKey(entry.shape);
    totalBeats += entry.beats;
    durationsUsed.add(entry.beats);
    if (entry.beats % 1 !== 0) nonIntegerBeats++;

    const info = shapeHardness(entry.shape, entry.barre);
    if (!shapesSeen.has(key)) shapesSeen.set(key, { info, count: 0 });
    shapesSeen.get(key).count++;

    if (info.isBarre || info.spread >= 3) {
      barreOrHardBeats += entry.beats;
      personalBarreOrHardBeats += (knownSet && knownSet.has(key)) ? entry.beats * 0.3 : entry.beats;
    }

    if (prevKey !== null && prevKey !== key) transitions++;
    prevKey = key;

    const t = entry.technique;
    if (['hammer-on', 'pull-off', 'slide', 'bend'].includes(t)) techniqueScoreRaw += 1.2;
    else if (['palm-mute', 'zupfen'].includes(t)) techniqueScoreRaw += 0.6;
  });

  // 1) Akkordvielfalt (0-20) – bereits bekannte Griffe zählen für dich persönlich weniger
  let hardnessSum = 0, personalHardnessSum = 0;
  shapesSeen.forEach((v, key) => {
    hardnessSum += v.info.hardness;
    personalHardnessSum += (knownSet && knownSet.has(key)) ? v.info.hardness * 0.25 : v.info.hardness;
  });
  const chordScore = clamp(Math.round(hardnessSum * 1.8), 0, 20);
  const personalChordScore = clamp(Math.round(personalHardnessSum * 1.8), 0, 20);

  // 2) Wechselgeschwindigkeit (0-20)
  const minutes = Math.max(totalBeats / Math.max(song.bpm || 100, 1), 0.05);
  const changesPerMinute = transitions / minutes;
  const speedScore = clamp(Math.round(changesPerMinute / 4), 0, 20);

  // 3) Barré-/Stretch-Anteil (0-15)
  const barreFraction = totalBeats > 0 ? barreOrHardBeats / totalBeats : 0;
  const barreScore = clamp(Math.round(barreFraction * 15), 0, 15);
  const personalBarreFraction = totalBeats > 0 ? personalBarreOrHardBeats / totalBeats : 0;
  const personalBarreScore = clamp(Math.round(personalBarreFraction * 15), 0, 15);

  // 4) Techniken (0-15)
  const techScore = clamp(Math.round(techniqueScoreRaw), 0, 15);

  // 5) Rhythmus-Komplexität (0-15)
  const rhythmScore = clamp(Math.round(durationsUsed.size * 2 + (nonIntegerBeats / prog.length) * 5), 0, 15);

  // 6) Tempo (0-10)
  const bpm = song.bpm || 100;
  let tempoScore = bpm < 80 ? 2 : bpm < 110 ? 4 : bpm < 140 ? 7 : 10;

  // 7) Songlänge (0-5)
  const lengthScore = clamp(Math.round(totalBeats / 16), 0, 5);

  const total = clamp(chordScore + speedScore + barreScore + techScore + rhythmScore + tempoScore + lengthScore, 0, 100);
  const personalTotal = (knownSet && knownSet.size)
    ? clamp(personalChordScore + speedScore + personalBarreScore + techScore + rhythmScore + tempoScore + lengthScore, 0, 100)
    : null;

  let label, color;
  if (total <= 20) { label = 'Anfänger'; color = 'var(--good)'; }
  else if (total <= 40) { label = 'Leicht-Fortgeschritten'; color = 'var(--good)'; }
  else if (total <= 60) { label = 'Mittel'; color = 'var(--warn)'; }
  else if (total <= 80) { label = 'Fortgeschritten'; color = 'var(--warn)'; }
  else { label = 'Experte'; color = 'var(--hard)'; }

  return {
    score: total, personalScore: personalTotal, label, color,
    distinctChords: shapesSeen.size,
    transitions, changesPerMinute: round1(changesPerMinute),
    breakdown: [
      { label: 'Akkordvielfalt', points: chordScore, max: 20 },
      { label: 'Wechseltempo', points: speedScore, max: 20 },
      { label: 'Barré / Stretch', points: barreScore, max: 15 },
      { label: 'Techniken', points: techScore, max: 15 },
      { label: 'Rhythmus', points: rhythmScore, max: 15 },
      { label: 'Tempo (BPM)', points: tempoScore, max: 10 },
      { label: 'Songlänge', points: lengthScore, max: 5 },
    ],
  };
}

/* ===================== Lernplan-Generator ===================== */

function groupSections(prog) {
  const out = [];
  prog.forEach((e, i) => {
    const last = out[out.length - 1];
    if (last && last.name === (e.section || 'Song')) last.entries.push(e);
    else out.push({ name: e.section || 'Song', entries: [e] });
  });
  return out;
}

function uniqueChordsInOrder(prog) {
  const seen = new Set();
  const out = [];
  prog.forEach(e => {
    const key = shapeKey(e.shape);
    if (!seen.has(key)) { seen.add(key); out.push(e); }
  });
  return out;
}

function topTransitions(prog, limit) {
  const map = new Map();
  for (let i = 1; i < prog.length; i++) {
    const a = prog[i - 1], b = prog[i];
    const ka = shapeKey(a.shape), kb = shapeKey(b.shape);
    if (ka === kb) continue;
    const pairKey = ka + '>>' + kb;
    if (!map.has(pairKey)) map.set(pairKey, { from: a, to: b, count: 0, hardness: 0 });
    const rec = map.get(pairKey);
    rec.count++;
    rec.hardness = Math.max(shapeHardness(a.shape).hardness, shapeHardness(b.shape).hardness);
  }
  return [...map.values()].sort((x, y) => (y.count - x.count) || (y.hardness - x.hardness)).slice(0, limit);
}

function buildLearningPlan(song, diff, knownSet) {
  const prog = song.progression || [];
  if (!prog.length) return [];
  const bpm = song.bpm || 100;
  const chords = uniqueChordsInOrder(prog);
  const transitions = topTransitions(prog, Math.min(8, Math.max(3, chords.length)));
  const sections = groupSections(prog);

  const tasks = [];

  chords.forEach(c => {
    if (knownSet && knownSet.has(shapeKey(c.shape))) return; // aus einem bereits gelernten Song bekannt
    tasks.push({ text: `Neuen Akkord sauber greifen: ${c.chord}`, minutes: 5, chords: [c], kind: 'chord' });
  });

  transitions.forEach(t => {
    const rampStart = Math.max(30, Math.round((bpm * 0.5) / 5) * 5);
    tasks.push({
      text: `Wechsel üben: ${t.from.chord} → ${t.to.chord} (Metronom ${rampStart}→${bpm} BPM)`,
      minutes: 6, chords: [t.from, t.to], targetBpm: bpm, kind: 'transition',
    });
  });

  sections.forEach(s => {
    const rampStart = Math.max(30, Math.round((bpm * 0.6) / 5) * 5);
    tasks.push({
      text: `Abschnitt "${s.name}" einzeln üben, langsam beginnen und steigern (${rampStart}→${bpm} BPM)`,
      minutes: 8, chords: uniqueChordsInOrder(s.entries), targetBpm: bpm, kind: 'section',
    });
  });

  tasks.push({ text: `Song komplett von Anfang bis Ende spielen, mehrere Durchläufe`, minutes: 10, chords: [], targetBpm: bpm, kind: 'full' });
  tasks.push({ text: `Feinschliff: Übergänge glätten, Dynamik, ggf. zur Aufnahme mitspielen`, minutes: 8, chords: [], targetBpm: bpm, kind: 'polish' });

  const effectiveScore = diff.personalScore != null ? diff.personalScore : diff.score;
  const totalDays = clamp(Math.round(3 + effectiveScore / 9), 3, 14);
  const days = [];
  let dayTasks = [], dayMinutes = 0, dayIdx = 1;
  const targetPerDay = 25;

  tasks.forEach(t => {
    if (dayMinutes > 0 && dayMinutes + t.minutes > targetPerDay && days.length < totalDays - 1) {
      days.push({ day: dayIdx++, tasks: dayTasks, minutes: dayMinutes });
      dayTasks = []; dayMinutes = 0;
    }
    dayTasks.push(t); dayMinutes += t.minutes;
  });
  if (dayTasks.length) days.push({ day: dayIdx++, tasks: dayTasks, minutes: dayMinutes });

  return days;
}

/* ===================== Griffbild-Rendering ===================== */

function renderGriffTable(shape) {
  let head = '<tr>' + STRING_LABELS.map((s, i) =>
    `<th><span class="string-bar" style="width:${8 + STRING_WEIGHT[i] * 3}px; height:${Math.max(1, STRING_WEIGHT[i])}px; margin-bottom:4px;"></span>${s}</th>`
  ).join('') + '</tr>';
  let body = '<tr>' + shape.map(v => {
    if (!isPlayed(v)) return `<td class="muted">x</td>`;
    if (Number(v) === 0) return `<td class="open">0</td>`;
    return `<td>${v}</td>`;
  }).join('') + '</tr>';
  return `<div class="griff"><table>${head}${body}</table></div>`;
}

function renderGriffCard(chordName, shape, tag) {
  return `<div class="griff-card">
    <div class="cname">${escapeHtml(chordName)}</div>
    ${renderGriffTable(shape)}
    ${tag ? `<div class="ctag">${escapeHtml(tag)}</div>` : ''}
  </div>`;
}

function renderChip(chordName, shape) {
  return `<div class="chip"><div class="cn">${escapeHtml(chordName)}</div><div class="cs">${shape.map(v => isPlayed(v) ? v : 'x').join(' ')}</div></div>`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* ===================== Notation-Rendering (VexFlow) ===================== */

function renderNotation(container, song) {
  container.innerHTML = '';
  if (typeof Vex === 'undefined') {
    container.innerHTML = '<div class="note">Notensatz-Bibliothek konnte nicht geladen werden (keine Internetverbindung?). Griffbilder funktionieren trotzdem.</div>';
    return;
  }
  const VF = Vex.Flow;
  const tuning = TUNINGS[song.tuning || 'standard'].midi;
  const capo = song.capo || 0;
  const timeSigNum = song.timeSignature || 4;
  const sections = groupSections(song.progression || []);

  sections.forEach(sec => {
    const heading = document.createElement('div');
    heading.className = 'section-label';
    heading.textContent = sec.name;
    container.appendChild(heading);

    const measures = [];
    let cur = [], curBeats = 0;
    sec.entries.forEach(e => {
      cur.push(e); curBeats += e.beats;
      if (curBeats >= timeSigNum) { measures.push(cur); cur = []; curBeats = 0; }
    });
    if (cur.length) measures.push(cur);

    let i = 0;
    while (i < measures.length) {
      const chunk = measures.slice(i, i + 4); // bis zu 4 Takte pro Zeile
      i += 4;

      const card = document.createElement('div');
      card.className = 'notation-card';
      container.appendChild(card);

      const width = 230 * chunk.length + 40;
      const renderer = new VF.Renderer(card, VF.Renderer.Backends.SVG);
      renderer.resize(width, 150);
      const ctx = renderer.getContext();

      let x = 10;
      chunk.forEach((measureEntries, mi) => {
        const stave = new VF.Stave(x, 25, 220);
        if (mi === 0) stave.addClef('treble').addTimeSignature(timeSigNum + '/4');
        stave.setContext(ctx).draw();

        try {
          const notes = measureEntries.map(entry => {
            const playedIdx = [];
            entry.shape.forEach((v, si) => { if (isPlayed(v)) playedIdx.push(si); });
            let keys;
            if (playedIdx.length === 0) {
              return new VF.StaveNote({ keys: ['b/4'], duration: beatsToDuration(entry.beats) + 'r' });
            }
            keys = playedIdx.map(si => pitchToVexKey(soundingMidi(tuning, si, entry.shape[si], capo) + 12));
            return new VF.StaveNote({ keys, duration: beatsToDuration(entry.beats), auto_stem: true });
          });
          const voice = new VF.Voice({ num_beats: timeSigNum, beat_value: 4 });
          voice.setStrict(false);
          voice.addTickables(notes);
          new VF.Formatter().joinVoices([voice]).format([voice], 185);
          voice.draw(ctx, stave);
          // Akkord-/Notenname als einfachen Text oberhalb jeder Note einzeichnen (robuster als VexFlow-Annotation-Modifier)
          notes.forEach((note, ni) => {
            try {
              ctx.save();
              ctx.setFont('Inter, sans-serif', 9);
              ctx.fillText(measureEntries[ni].chord, note.getAbsoluteX() - 4, stave.getYForLine(0) - 10);
              ctx.restore();
            } catch (labelErr) { /* Label ist optional, Noten bleiben trotzdem sichtbar */ }
          });
        } catch (err) {
          // Falls ein Takt nicht sauber notierbar ist, Takt einfach leer lassen statt die App zu blockieren
          console.warn('Notation-Fehler in Takt', err);
        }
        x += 220;
      });
    }
  });
}

  saveSongs();

function mkEntry(section, chord, shape, beats, technique, barre) {
  return { section, chord, shape, beats, technique: technique || 'strum', barre: !!barre };
}

function demoAmazingGrace() {
  const g = CHORD_LIBRARY;
  const prog = [];
  const verse = [
    ['G', g.G.shape, 3], ['G', g.G.shape, 1], ['C', g.C.shape, 2], ['G', g.G.shape, 2],
    ['G', g.G.shape, 2], ['Em', g.Em.shape, 2], ['D', g.D.shape, 4],
    ['G', g.G.shape, 3], ['G', g.G.shape, 1], ['C', g.C.shape, 2], ['G', g.G.shape, 2],
    ['Em', g.Em.shape, 2], ['D', g.D.shape, 2], ['G', g.G.shape, 4],
  ];
  verse.forEach(([name, shape, beats]) => prog.push(mkEntry('Strophe', name, shape, beats, 'strum')));
  return {
    id: uid(), title: 'Amazing Grace', artist: 'Traditional (Public Domain)',
    bpm: 76, capo: 0, tuning: 'standard', timeSignature: 4,
    notes: 'Eigene, vereinfachte Beispiel-Begleitung eines traditionellen, gemeinfreien Kirchenlieds – ideal zum Einstieg in Akkordwechsel.',
    progression: prog,
  };
}

function demoExerciseRiff() {
  const prog = [];
  const frets = [0, 2, 3, 0, 2, 3, 0, 2];
  frets.forEach((fret, i) => {
    const shape = ['x','x','x','x','x','x'];
    const stringIdx = i < 3 ? 0 : i < 6 ? 1 : 2; // wandert von tiefer E- zur A- zur D-Saite
    shape[stringIdx] = fret;
    prog.push(mkEntry('Aufwärmriff', `${STRING_LABELS[stringIdx]}${fret}`, shape, 0.5, i % 3 === 2 ? 'hammer-on' : 'einzelton'));
  });
  prog.push(mkEntry('Aufwärmriff', 'E5', CHORD_LIBRARY.E5.shape, 2, 'palm-mute'));
  return {
    id: uid(), title: 'Aufwärm-Riff in E', artist: 'Griffwerk – eigene Übung',
    bpm: 100, capo: 0, tuning: 'standard', timeSignature: 4,
    notes: 'Ein selbst komponiertes kurzes Übungsriff zum Testen von Einzeltönen, Hammer-Ons und Palm Mute.',
    progression: prog,
  };
}

/* ===================== Rendering: Song-Liste ===================== */

function songCardHtml(s) {
  const diff = computeDifficulty(s, knownChordSet);
  const plan = buildLearningPlan(s, diff, knownChordSet);
  const pr = progressFor(s.id);
  const totalTasks = plan.reduce((a, d) => a + d.tasks.length, 0);
  const doneTasks = Object.keys(pr.doneTasks).filter(k => k.startsWith(s.id + ':') && pr.doneTasks[k]).length;
  const pct = totalTasks ? Math.round((doneTasks / totalTasks) * 100) : 0;
  return `<div class="song-card ${s.id === currentSongId ? 'selected' : ''}" data-id="${s.id}">
    <div class="title">${s.favorite ? '★ ' : ''}${escapeHtml(s.title)}</div>
    <div class="artist">${escapeHtml(s.artist || '')}</div>
    <div class="meta-row">
      <span class="badge" style="background:${diff.color}">${formatScore(diff)}</span>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
  </div>`;
}

}

function toggleFavorite(songId) {

  s.favorite = !s.favorite;

  renderAll();

function renderTabContent(song, diff) {

  if (currentTab === 'chords') return renderChordsTab(el, song);
  if (currentTab === 'notation') return renderNotationTab(el, song);
  if (currentTab === 'plan') return renderPlanTab(el, song, diff);

      </div>
    </div>

/* ===================== Metronom (Web Audio, lookahead scheduler) ===================== */

function toggleMetronome() {
  const btn = document.getElementById('metro-toggle');
  if (metronome.running) {
    metronome.running = false;
    clearTimeout(metronome.timerId);
    if (metronome.audioCtx) metronome.audioCtx.close();
    metronome.audioCtx = null;
    btn.textContent = '▶︎ Start';
    btn.classList.remove('running');
    return;
  }
  metronome.running = true;
  metronome.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  metronome.nextTime = metronome.audioCtx.currentTime + 0.05;
  metronome.beatCount = 0;
  btn.textContent = '■ Stop';
  btn.classList.add('running');
  metronomeScheduler();
}

function metronomeScheduler() {
  if (!metronome.running) return;
  const ctx = metronome.audioCtx;
  while (metronome.nextTime < ctx.currentTime + 0.1) {
    playClick(ctx, metronome.nextTime, metronome.beatCount % 4 === 0);
    metronome.nextTime += 60 / metronome.bpm;
    metronome.beatCount++;
  }
  metronome.timerId = setTimeout(metronomeScheduler, 25);
}

function playClick(ctx, time, accent) {
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.frequency.value = accent ? 1400 : 900;
  gain.gain.setValueAtTime(0.25, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + 0.06);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(time); osc.stop(time + 0.07);
}

/* ===================== Übungs-Stoppuhr ===================== */

function toggleStopwatch(songId, dayIdx) {
  const btn = document.getElementById('sw-toggle');
  const statusEl = document.getElementById('sw-status');
  if (stopwatch.running) {
    stopwatch.running = false;
    clearInterval(stopwatch.timerId);
    const elapsed = stopwatch.elapsedBefore + (Date.now() - stopwatch.startedAt) / 1000;
    const pr = progressFor(songId);
    const key = 'day' + dayIdx + '-' + Date.now();
    pr.sessions[key] = elapsed;
    saveProgress();
    stopwatch.elapsedBefore = 0;
    btn.textContent = 'Start'; btn.classList.remove('running');
    statusEl.textContent = 'Bereit';
    renderSongList();
    showTotalPracticed(songId);
    return;
  }
  stopwatch.running = true;
  stopwatch.startedAt = Date.now();
  btn.textContent = 'Stop'; btn.classList.add('running');
  statusEl.textContent = 'Übe gerade …';
  stopwatch.timerId = setInterval(updateStopwatchDisplay, 500);
}

function updateStopwatchDisplay() {
  const disp = document.getElementById('sw-display');
  if (!disp) return;
  const elapsed = stopwatch.elapsedBefore + (stopwatch.running ? (Date.now() - stopwatch.startedAt) / 1000 : 0);
  disp.textContent = formatClock(elapsed);
}

let editorState = { mode: 'json', entries: [] };

function openEditor(prefill) {
  editorState = {
    mode: 'manual', entries: [],
    editingId: null, fromQueueId: null, jsonSeed: '',
    prefillTitle: '', prefillArtist: '', prefillSpotifyUrl: '',
    prefillBpm: 100, prefillCapo: 0, prefillTimeSignature: 4, prefillTuning: 'standard',
  };
  if (prefill && prefill.existingSong) {
    const s = prefill.existingSong;
    editorState.editingId = s.id;
    editorState.mode = 'json';
    editorState.entries = (s.progression || []).map(e => ({ ...e, shape: [...e.shape] }));
    editorState.prefillTitle = s.title;
    editorState.prefillArtist = s.artist || '';
    editorState.prefillSpotifyUrl = s.spotifyUrl || '';
    editorState.prefillBpm = s.bpm;
    editorState.prefillCapo = s.capo;
    editorState.prefillTimeSignature = s.timeSignature;
    editorState.prefillTuning = s.tuning;
    const seed = { ...s };
    delete seed.id; delete seed.mastered; delete seed.favorite;
    editorState.jsonSeed = JSON.stringify(seed, null, 2);
  } else if (prefill) {
    editorState.prefillTitle = prefill.title || '';
    editorState.prefillArtist = prefill.artist || '';
    editorState.prefillSpotifyUrl = prefill.spotifyUrl || '';
    editorState.fromQueueId = prefill.fromQueueId || null;
  }
  renderEditorModal();
}

        <select class="p-tech">${TECHNIQUES.map(t => `<option value="${t.v}" ${t.v === e.technique ? 'selected' : ''}>${t.l}</option>`).join('')}</select>
      </div>
      <button class="icon-btn p-del">✕</button>
    </div>
  `).join('') || '<div class="note" style="padding:10px;">Noch keine Einträge – füge oben Akkorde hinzu.</div>';

  el.querySelectorAll('.prog-row').forEach(row => {
    const i = Number(row.dataset.i);
    row.querySelector('.p-section').addEventListener('input', e => editorState.entries[i].section = e.target.value);
    row.querySelector('.p-chord').addEventListener('input', e => editorState.entries[i].chord = e.target.value);
    row.querySelector('.p-beats').addEventListener('change', e => editorState.entries[i].beats = Number(e.target.value));
    row.querySelector('.p-tech').addEventListener('change', e => editorState.entries[i].technique = e.target.value);
    row.querySelectorAll('.p-fret').forEach(inp => {
      inp.addEventListener('input', e => {
        const si = Number(e.target.dataset.si);
        const v = e.target.value.trim();
        editorState.entries[i].shape[si] = v === 'x' || v === '' ? 'x' : Number(v);
      });
    });
    row.querySelector('.p-del').addEventListener('click', () => { editorState.entries.splice(i, 1); renderProgList(); });
  });
}

function saveFromEditor() {
  let raw;
  if (editorState.mode === 'json') {
    const text = document.getElementById('json-input').value.trim();
    if (!text) return alert('Bitte JSON einfügen.');
    try { raw = JSON.parse(text); } catch (e) { return alert('Ungültiges JSON: ' + e.message); }
  } else {
    const title = document.getElementById('f-title').value.trim();
    if (!title) return alert('Bitte einen Titel angeben.');
    if (!editorState.entries.length) return alert('Bitte mindestens einen Akkord zur Akkordfolge hinzufügen.');
    raw = {
      title,
      artist: document.getElementById('f-artist').value.trim(),
      bpm: document.getElementById('f-bpm').value,
      capo: document.getElementById('f-capo').value,
      timeSignature: document.getElementById('f-time').value,
      tuning: document.getElementById('f-tuning').value,
      spotifyUrl: document.getElementById('f-spotify').value.trim(),
      progression: editorState.entries,
    };
  }
  let song;
  try { song = sanitizeSongData(raw); } catch (e) { return alert(e.message); }

  if (editorState.editingId) {
    const idx = songs.findIndex(s => s.id === editorState.editingId);
    song.id = editorState.editingId;
    song.mastered = idx !== -1 ? !!songs[idx].mastered : false;
    song.favorite = idx !== -1 ? !!songs[idx].favorite : false;
    if (idx !== -1) songs[idx] = song; else songs.push(song);
  } else {
    song.id = uid();
    song.mastered = false;
    song.favorite = false;
    songs.push(song);
    if (editorState.fromQueueId) {
      queue = queue.filter(q => q.id !== editorState.fromQueueId);
      saveQueue();
    }
  }
  saveSongs();
  currentSongId = song.id;
  currentTab = 'overview';
  closeEditor();
  renderAll();
}

/* ===================== Spotify-Import (Warteliste & Vorschläge) ===================== */

function openSpotifyImport() {
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-backdrop" id="spotify-backdrop">
      <div class="modal">
        <h3>Von Spotify importieren</h3>
        <div class="note">Griffwerk hat keinen eigenen Server und kann sich daher nicht selbst bei Spotify anmelden. Bitte Claude im Chat z. B.: "Lies meine Spotify-Playlist [Name/Link] aus" oder "Schlag mir ähnliche Songs zu [Song] vor" – das Ergebnis hier als JSON-Liste einfügen.</div>
        <div class="field" style="margin-top:12px;">
          <span>Ziel</span>
          <select id="spotify-target">
            <option value="queue">Warteliste (Songs, die ich als Nächstes lernen will)</option>
            <option value="suggestions">Vorschläge (ähnliche Songs, noch nicht entschieden)</option>
          </select>
        </div>
        <div class="field" style="margin-top:10px;">
          <span>JSON-Liste</span>
          <textarea id="spotify-json" rows="10" placeholder='[{"title":"...","artist":"...","spotifyUrl":"...","reason":"nur bei Vorschlägen"}]'></textarea>
        </div>
        <div class="modal-footer">
          <button class="export-btn" id="spotify-cancel">Abbrechen</button>
          <button class="export-btn primary" id="spotify-save">Übernehmen</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('spotify-cancel').addEventListener('click', closeEditor);
  document.getElementById('spotify-backdrop').addEventListener('click', e => { if (e.target.id === 'spotify-backdrop') closeEditor(); });
  document.getElementById('spotify-save').addEventListener('click', saveSpotifyImport);
}

function saveSpotifyImport() {
  const target = document.getElementById('spotify-target').value;
  const text = document.getElementById('spotify-json').value.trim();
  if (!text) return alert('Bitte JSON-Liste einfügen.');
  let arr;
  try { arr = JSON.parse(text); } catch (e) { return alert('Ungültiges JSON: ' + e.message); }
  if (!Array.isArray(arr) || !arr.length) return alert('Erwarte eine JSON-Liste mit mindestens einem Eintrag.');
  let stubs;
  try { stubs = arr.map(sanitizeStub); } catch (e) { return alert(e.message); }
  if (target === 'queue') {
    queue = queue.concat(stubs);
    saveQueue();
  } else {
    suggestions = suggestions.concat(stubs);
    saveSuggestions();
  }
  closeEditor();
  renderAll();
}

/* ===================== Automatischer Spotify-Abruf ===================== */
// Claude pflegt data/spotify-suggestions.json im Repo (taeglicher Hintergrund-Check der
// Hoergewohnheiten). Beim Laden holt sich die App diese Datei selbst per fetch() vom
// eigenen Ursprung (funktioniert nur, wenn die Seite ueber eine echte URL wie GitHub
// Pages laeuft, nicht per file://-Doppelklick) und uebernimmt neue Eintraege automatisch
// in die Warteliste. Jeder Eintrag wird per stabiler "id" nur einmal uebernommen, auch
// wenn er spaeter wieder aus der Warteliste geloescht wurde.
const SEEN_SPOTIFY_IDS_KEY = 'griffwerk.seenSpotifyIds.v1';

function loadSeenSpotifyIds() {
  try { return new Set(JSON.parse(localStorage.getItem(SEEN_SPOTIFY_IDS_KEY)) || []); } catch (e) { return new Set(); }
}
function saveSeenSpotifyIds(set) { localStorage.setItem(SEEN_SPOTIFY_IDS_KEY, JSON.stringify([...set])); }

async function autoImportSpotifySuggestions() {
  let data;
  try {
    const res = await fetch('./data/spotify-suggestions.json', { cache: 'no-store' });
    if (!res.ok) return;
    data = await res.json();
  } catch (e) {
    return; // kein Netz, lokal per file:// geoeffnet, oder Datei existiert (noch) nicht
  }
  if (!Array.isArray(data) || !data.length) return;

  const seen = loadSeenSpotifyIds();
  let added = false;
  data.forEach(raw => {
    if (!raw || typeof raw !== 'object' || !raw.id || seen.has(String(raw.id))) return;
    seen.add(String(raw.id));
    let stub;
    try { stub = sanitizeStub(raw); } catch (e) { return; }
    stub.id = String(raw.id); // stabile ID statt zufaelliger uid(), damit ein erneuter Abruf nicht doppelt einfuegt
    queue.push(stub);
    added = true;
  });
  saveSeenSpotifyIds(seen);
  if (added) { saveQueue(); renderAll(); }
}

/* ===================== Export / Import ===================== */

function exportAll() {
  const blob = new Blob([JSON.stringify({ songs, progress, queue, suggestions }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'griffwerk-export.json';
  a.click();
}

/* ===================== Init ===================== */

function renderAll() {
  knownChordSet = knownChordShapes();
  renderSongList();
  renderMain();
}

document.getElementById('new-song-btn').addEventListener('click', () => openEditor());
document.getElementById('spotify-import-btn').addEventListener('click', openSpotifyImport);

seedDemoIfEmpty();
renderAll();
autoImportSpotifySuggestions();
</script>
